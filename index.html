
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeverKeyYDQH</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #09070e;
  color: white;
}
header {
  padding: 22px 16px;
  background: #150d20;
  border-bottom: 1px solid #63368a;
}
h1 { color: #c084fc; margin: 0; }
header p { color: #c4b5d5; }
main { max-width: 900px; margin: auto; padding: 24px 16px; }
.hero {
  padding: 28px 20px;
  border-radius: 18px;
  background: linear-gradient(135deg,#32134d,#140d20);
}
h2 { color: #d8b4fe; }
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 16px;
}
.card {
  padding: 20px;
  background: #1b1227;
  border: 1px solid #49305e;
  border-radius: 14px;
}
.price { color: #d8b4fe; font-weight: bold; }
button {
  padding: 11px 15px;
  border: 0;
  border-radius: 9px;
  background: #9333ea;
  color: white;
  font-weight: bold;
}
footer { text-align: center; padding: 25px; color: #aaa; }
</style>
</head>
<body>
<header>
  <h1>🎮 SeverKeyYDQH</h1>
  <p>DIGITAL GAMING STORE</p>
</header>
<main>
  <section class="hero">
    <h2>MỞ KHÓA THẾ GIỚI GAME</h2>
    <p>Khám phá các sản phẩm kỹ thuật số trong không gian gaming đen–tím.</p>
    <a href="#products"><button>Xem sản phẩm</button></a>
  </section>
  <section id="products">
    <h2>✦ Sản phẩm nổi bật</h2>
    <div class="products">
      <article class="card">
        <h3>🎮 Game Key A</h3>
        <p>Sản phẩm mẫu để thử giao diện.</p>
        <p class="price">50.000đ</p>
        <button onclick="alert('Đây là sản phẩm demo, chưa nhận thanh toán.')">Xem thử</button>
      </article>
      <article class="card">
        <h3>🕹️ Game Key B</h3>
        <p>Sản phẩm mẫu để thử giao diện.</p>
        <p class="price">80.000đ</p>
        <button onclick="alert('Đây là sản phẩm demo, chưa nhận thanh toán.')">Xem thử</button>
      </article>
    </div>
  </section>
</main>
<footer>© 2026 SeverKeyYDQH · Website demo</footer>
</body>
</html>
